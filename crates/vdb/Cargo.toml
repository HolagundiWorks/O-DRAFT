[package]
name = "aad-vdb"
description = "AAD .vdb store: embeds ShilpiDB (codec + SpatialGrid) and talks to shilpid via shilpi-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Pinned to one ShilpiDB commit so the embedded engine and the client share one type.
# To bump: set the same `rev` on both crates, refresh Cargo.lock, then
# `cargo test -p aad-vdb` (see docs/architecture/aadt-shilpidb-architecture.md).
shilpidb = { git = "https://github.com/HolagundiWorks/shilpidb", tag = "v0.2.1" }
shilpi-client = { git = "https://github.com/HolagundiWorks/shilpidb", tag = "v0.2.1" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
