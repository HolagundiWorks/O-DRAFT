[package]
name = "aad-dwg"
description = "AAD DWG bridge: converts DWG to and from DXF bytes using the acadrust crate (MPL-2.0, used unmodified)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
# Job Object memory caps for the DWG worker need Win32 `unsafe` (`job_win`).
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# MPL-2.0: used as an unmodified dependency only (see plan/adr/0001 and NOTICE).
# Pinned: 0.6.8 loses merged table cells on a DWG round trip (aad-io dwg_roundtrip_keeps_extension_data) and reads the
# alloc-bomb fixture as an empty drawing instead of refusing it (aad-cli dwg_isolation). Re-test before raising.
acadrust = "=0.6.3"
