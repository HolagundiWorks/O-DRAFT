[package]
name = "aad-odp"
description = "The .osp project file: one SQLite file holding a drawing, its take-off, the O-CoreOp project, assets and markups"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# SQLite is compiled in: no system library, the same engine on every platform. The web build has no project file.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
