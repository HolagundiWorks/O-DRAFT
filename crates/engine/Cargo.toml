[package]
name = "aad-engine"
description = "AAD engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aad-geom = { workspace = true }
aad-color = { workspace = true }
aad-doc = { workspace = true }
aad-fonts = { workspace = true }
aad-render = { workspace = true }
aad-office = { workspace = true }
# The project file (.osp); on the web build only its history model is used.
aad-odp = { workspace = true }
aad-param = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[dev-dependencies]
aad-io = { workspace = true }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
tempfile = "3"

[[bench]]
name = "selection"
harness = false

[[bench]]
name = "drawing_operations"
harness = false
